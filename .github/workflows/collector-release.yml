# Collector release, BY HAND ONLY (Sagentix, 2026-10-15). Three jobs, each switched on separately:
#
#   npm      tests, builds the package (collector/scripts/stage-package.mjs), writes a CycloneDX SBOM, then
#            `npm stage publish --provenance` through npm trusted publishing (OIDC; no npm token is stored); the
#            version goes live only when a maintainer approves it with 2FA (`npm stage approve`, collector/RELEASING.md).
#   runner   builds collector/runner/Dockerfile for linux/amd64 and pushes it to GHCR with
#            BuildKit's SLSA provenance (mode=max) and SBOM attached, plus a GitHub build attestation.
#   channel  (post_channel) signs the release target with the `release` environment's key and posts it to sos-app,
#            which makes it the candidate for its canary organizations (the job's own comment, below).
#
# Nothing here deploys sos-app, and no step reads CLOUDFLARE_API_TOKEN or CLOUDFLARE_API_TOKEN_SOS_APP.
#
# It does nothing real until a Sagentix maintainer sets it up (collector/RELEASING.md has the steps):
#   - npm: the repository variable NPM_TRUSTED_PUBLISHER must be "configured" and the input publish=true;
#     otherwise the job stops after `npm publish --dry-run`.
#   - GitHub attestations and npm provenance both refuse a PRIVATE repository on this plan; the job checks
#     the repository's visibility and says so rather than failing half-way.
#   - runner: the input push_image=true; otherwise the image is built and checked, not pushed.
name: collector-release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm (needs NPM_TRUSTED_PUBLISHER = configured)"
        type: boolean
        default: false
      push_image:
        description: "Push the runner image to GHCR"
        type: boolean
        default: false
      post_channel:
        description: "Sign the release target and post it to sos-app's channel (needs publish; the release environment approves it)"
        type: boolean
        default: false
      fixes:
        description: "Error signature ids this release fixes (64 hex, space separated), beside the head commit's Fixes-Signature trailers"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: collector-release
  cancel-in-progress: false

jobs:
  # QA (collector-qa.yml: coverage floors, the doctor, a dry run, timings) runs beside the gate on this exact commit.
  qa:
    uses: ./.github/workflows/collector-qa.yml
    permissions:
      contents: read

  # The security gate (collector-security.yml) runs first, on this exact commit; nothing below starts unless it passes.
  security:
    uses: ./.github/workflows/collector-security.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  npm:
    needs: [security, qa]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm   # a maintainer may add a required reviewer to this environment (Settings -> Environments)
    permissions:
      contents: read
      id-token: write   # npm trusted publishing and provenance: GitHub's OIDC token, no stored npm token
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: collector/package-lock.json
      # Trusted publishing needs npm CLI 11.5.1 or later [npm docs, "Trusted publishing for npm packages"].
      - run: npm install -g npm@11.20.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the package
        env:
          PACKAGE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: node scripts/stage-package.mjs
      - name: Smoke test the packed tarball
        run: |
          cd build && npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try" && npm init -y >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/*.tgz
          # The usage text goes to stderr (collector/src/cli.ts prints it with deps.err); the first dry run, 2026-10-26, failed here.
          npx collector --help 2>&1 | grep -q "collector run --endpoint"
      - name: CycloneDX SBOM of the published dependencies
        run: |
          cd build && npm install --omit=dev --ignore-scripts --no-audit --no-fund
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-format JSON --spec-version 1.6 \
            --output-reproducible --validate --output-file "$RUNNER_TEMP/collector-npm.cdx.json"
          rm -rf node_modules package-lock.json
          sha256sum "$RUNNER_TEMP/collector-npm.cdx.json" "$RUNNER_TEMP"/*.tgz | tee "$RUNNER_TEMP/SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collector-npm-release
          path: |
            ${{ runner.temp }}/*.tgz
            ${{ runner.temp }}/collector-npm.cdx.json
            ${{ runner.temp }}/SHA256SUMS
          retention-days: 400
      - name: Publish (or dry run)
        working-directory: collector/build
        env:
          WANT: ${{ inputs.publish }}
          CONFIGURED: ${{ vars.NPM_TRUSTED_PUBLISHER }}
          PRIVATE_REPO: ${{ github.event.repository.private }}
        run: |
          if [ "$WANT" != "true" ] || [ "$CONFIGURED" != "configured" ]; then
            echo "::notice::Dry run (publish=$WANT, NPM_TRUSTED_PUBLISHER=${CONFIGURED:-unset}). See collector/RELEASING.md."
            npm publish --dry-run --provenance=false
            exit 0
          fi
          if [ "$PRIVATE_REPO" = "true" ]; then
            echo "::error::npm provenance is refused for a private source repository. Publish from the public release repository (collector/RELEASING.md, step 1)."
            exit 1
          fi
          # The trusted publisher's permission is "npm stage publish" (set 2026-10-27): a direct `npm publish` from
          # here answers 403 "OIDC permission denied" (run 40439484580). npm 11.20.0 has `npm stage`.
          npm stage publish --provenance --access public
          echo "::notice::Staged on npm. A maintainer approves it with 2FA: npm stage list @sagentix-inc/evidence-collector, then npm stage approve <id> (collector/RELEASING.md, step 6)."

  runner:
    needs: [security, qa]
    runs-on: ubuntu-latest
    # The Go engines build from source (about 25 minutes on a hosted runner, 2026-10-26); the push build reuses the
    # scan build's layers through the Actions cache, so 90 minutes leaves room.
    timeout-minutes: 90
    # For the channel job: the pushed image's name and digest (empty when push_image is off).
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write        # push to ghcr.io/<owner>/sagentix-collector-runner (only with push_image)
      id-token: write        # GitHub build attestation (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image name and tags
        id: meta
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          version="$(node -p "require('./collector/package.json').version")"
          echo "image=ghcr.io/$owner/sagentix-collector-runner" >> "$GITHUB_OUTPUT"
          echo "tags=ghcr.io/$owner/sagentix-collector-runner:$version,ghcr.io/$owner/sagentix-collector-runner:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - if: inputs.push_image
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The runner image (Python scanners, pandas among them) outgrew the hosted runner's free disk: the first dry run,
      # 2026-10-26, stopped with "no space left on device". Remove toolchains this job never uses before building.
      - name: Free disk space for the image build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /
      # The image is scanned before it can be pushed: build it locally, let Trivy fail the job on a
      # MEDIUM-or-worse vulnerability or a secret, then the push step reuses the cached layers.
      - name: Build for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: collector/runner/Dockerfile
          platforms: linux/amd64
          build-args: COLLECTOR_COMMIT=${{ github.sha }}
          load: true
          tags: sagentix-collector-runner:scan
          cache-from: type=gha,scope=collector-runner
          cache-to: type=gha,scope=collector-runner,mode=max
      # Exceptions live in collector/runner/trivyignore.yaml, each with a reason and an expiry at most 30 days out
      # (tests/test_engine_updates.py holds that); an expired one stops counting and the gate fails again.
      # On a failure, the JSON report is an artifact: collector/runner/go_fixes.py turns it into module floors.
      - name: Scan the image
        env:
          TRIVY_VERSION: "0.76.0"
          TRIVY_SHA256: "e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7"
        run: |
          f="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$f"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" trivy
          set -- --scanners vuln,secret --severity MEDIUM,HIGH,CRITICAL --ignore-unfixed --ignorefile collector/runner/trivyignore.yaml
          rc=0
          "$RUNNER_TEMP/trivy" image "$@" --exit-code 1 --format json --output "$RUNNER_TEMP/scan.json" sagentix-collector-runner:scan || rc=$?
          "$RUNNER_TEMP/trivy" convert --format table "$RUNNER_TEMP/scan.json"
          exit "$rc"
      - name: Keep the scan report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: runner-image-scan, path: "${{ runner.temp }}/scan.json", retention-days: 14 }
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: collector/runner/Dockerfile
          # amd64 only: on arm64, pip must compile Prowler 5.45.0's zstd dependency (no aarch64 wheel for
          # Python 3.13) and the slim base has no compiler (collector/runner/README.md, Build).
          platforms: linux/amd64
          build-args: COLLECTOR_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=collector-runner
          push: ${{ inputs.push_image }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=sagentix-collector-runner
      - name: GitHub build attestation
        if: inputs.push_image && github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PUSHED: ${{ inputs.push_image }}
          PRIVATE_REPO: ${{ github.event.repository.private }}
        run: |
          {
            echo "### Runner image"
            echo "tags: ${{ steps.meta.outputs.tags }}"
            echo "digest: ${DIGEST:-not pushed}; pushed: $PUSHED"
            echo "BuildKit SLSA provenance (mode=max) and SBOM attached to the image index."
            [ "$PRIVATE_REPO" = "true" ] && echo "GitHub attestation skipped: private repository (needs a public repo or GitHub Enterprise Cloud)."
            true
          } >> "$GITHUB_STEP_SUMMARY"

  # The release target, signed and posted to sos-app's channel (2026-11-08; apps/sos-app/docs/COLLECTOR_CHANNEL.md,
  # section 14). Optional: only with post_channel ticked, and only after the npm and runner jobs. It runs in the
  # protected environment `release`, whose required reviewer (Stéphane) approves it, and reads two environment secrets:
  #   COLLECTOR_RELEASE_SIGNING_KEY   the second release key (Ed25519, PKCS#8 DER, base64), whose public half is pinned in
  #                                   collector/src/release_keys.ts; the script refuses a key that is not pinned
  #   COLLECTOR_RELEASE_POST_TOKEN    the bearer secret each sos-app environment holds as a Worker secret
  # and the environment variable SOS_APP_RELEASE_ENDPOINTS (sos-app origins, space separated). Without them the job
  # says so and ends green, and the Mac Keychain path (apps/sos-app/scripts/collector-channel.mjs) remains. No model and
  # no AI key here. The post names the error signatures this release fixes: the `fixes` input and the head commit's
  # `Fixes-Signature:` trailers.
  channel:
    needs: [npm, runner]
    if: inputs.post_channel && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Are the release key, the token and the endpoints set?
        id: ready
        env:
          KEY: ${{ secrets.COLLECTOR_RELEASE_SIGNING_KEY }}
          TOKEN: ${{ secrets.COLLECTOR_RELEASE_POST_TOKEN }}
          ENDPOINTS: ${{ vars.SOS_APP_RELEASE_ENDPOINTS }}
        run: |
          if [ -z "$KEY" ] || [ -z "$TOKEN" ] || [ -z "$ENDPOINTS" ]; then
            echo "::notice::The release environment has no COLLECTOR_RELEASE_SIGNING_KEY, COLLECTOR_RELEASE_POST_TOKEN or SOS_APP_RELEASE_ENDPOINTS: nothing posted. Sign the target on the release Mac (apps/sos-app/scripts/collector-channel.mjs, collector/RELEASING.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign the release target and post it
        if: steps.ready.outputs.ready == 'true'
        working-directory: collector
        env:
          COLLECTOR_RELEASE_SIGNING_KEY: ${{ secrets.COLLECTOR_RELEASE_SIGNING_KEY }}
          COLLECTOR_RELEASE_POST_TOKEN: ${{ secrets.COLLECTOR_RELEASE_POST_TOKEN }}
          SOS_APP_ENDPOINTS: ${{ vars.SOS_APP_RELEASE_ENDPOINTS }}
          IMAGE: ${{ needs.runner.outputs.image }}
          DIGEST: ${{ needs.runner.outputs.digest }}
          PUSHED: ${{ inputs.push_image }}
          FIXES_INPUT: ${{ inputs.fixes }}
        run: |
          version="$(node -p "require('./package.json').version")"
          trailers="$(git log -1 --format='%(trailers:key=Fixes-Signature,valueonly)')"
          image=""
          if [ "$PUSHED" = "true" ] && [ -n "$DIGEST" ]; then image="$IMAGE:$version@$DIGEST"; fi
          node scripts/post-release-target.mjs --version "$version" --commit "$GITHUB_SHA" --image "$image" --fixes "$FIXES_INPUT $trailers"
