# Collector security gate (Sagentix, 2026-10-17): the collector is scanned for security flaws before every
# release and every time it changes. It runs on every
# push and pull request that touches the collector or what it ships, weekly (new advisories find old code),
# and as a called job: collector-release.yml publishes nothing unless this passes in the same run, and
# collector/scripts/sync-public-repo.sh refuses a commit this workflow has not passed on.
#
#   dependencies  npm audit of the shipped dependencies, and npm's registry signatures and provenance
#   trivy         known vulnerabilities in the lockfile, secrets, and Dockerfile misconfigurations
#   codeql        static analysis of collector/src (security-extended queries)
#
# Any finding fails the gate: MEDIUM and above for Trivy, moderate and above for npm audit, any CodeQL result
# not listed with a reason in collector/security/accepted-findings.json.
# It reads no secret and deploys nothing.
name: collector-security

on:
  push:
    branches: [rnd, main]
    paths:
      - "collector/**"
      - "apps/sos-app/src/data/checks/**"
      - "apps/sos-app/src/data/fedramp_rules.json"
      - ".github/workflows/collector-security.yml"
      - ".github/workflows/collector-release.yml"
  pull_request:
    paths:
      - "collector/**"
      - "apps/sos-app/src/data/checks/**"
      - ".github/workflows/collector-security.yml"
  schedule:
    - cron: "17 7 * * 1"   # Mondays 07:17 UTC
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - run: npm ci --ignore-scripts
      - name: npm audit (shipped dependencies)
        run: npm audit --omit=dev --audit-level=moderate
      - name: npm audit (build and test tools)
        run: npm audit --audit-level=high
      - name: Registry signatures and provenance of every installed package
        run: npm audit signatures

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The version and checksum collector/runner/Dockerfile pins (release asset trivy_<v>_Linux-64bit.tar.gz).
      TRIVY_VERSION: "0.74.0"
      TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Trivy (checksum checked)
        run: |
          f="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$f"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" trivy
      - name: Vulnerabilities, secrets and misconfigurations
        run: |
          "$RUNNER_TEMP/trivy" fs --scanners vuln,secret,misconfig --severity MEDIUM,HIGH,CRITICAL \
            --exit-code 1 --skip-dirs collector/node_modules --format table collector

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # used only where code scanning exists (the public mirror)
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths: [collector/src, collector/scripts]
            paths-ignore: ["**/node_modules", "**/*.json"]
            queries: [{ uses: security-extended }]
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /collector
          output: ${{ runner.temp }}/codeql
          upload: ${{ github.event.repository.private == false && 'always' || 'never' }}
      - name: Fail on any finding not reviewed and accepted
        run: |
          python3 - "$RUNNER_TEMP/codeql" collector/security/accepted-findings.json <<'PY'
          import glob, json, sys
          accepted = {(a["rule"], a["file"]) for a in json.load(open(sys.argv[2]))["accepted"] if a.get("reason") and a.get("date")}
          new, seen = [], set()
          for f in glob.glob(sys.argv[1] + "/*.sarif"):
              for run in json.load(open(f))["runs"]:
                  for r in run.get("results", []):
                      loc = r["locations"][0]["physicalLocation"]
                      key = (r["ruleId"], loc["artifactLocation"]["uri"])
                      if key in accepted: seen.add(key); continue
                      new.append(f"{key[0]} {key[1]}:{loc.get('region', {}).get('startLine', '?')}")
          print(f"CodeQL collector: {len(new)} new finding(s), {len(seen)} accepted (collector/security/accepted-findings.json)")
          for k in sorted(accepted - seen): print(f"::warning::accepted finding no longer reported, remove it: {k[0]} {k[1]}")
          for r in new: print("::error::" + r)
          sys.exit(1 if new else 0)
          PY
